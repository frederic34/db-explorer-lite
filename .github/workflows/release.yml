name: Build et release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que le tag correspond à la version du package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du package.json (v${PKG_VERSION})."
            exit 1
          fi

      - name: Vérifier les types, compiler et empaqueter le .vsix
        run: npm run package

      - name: Conserver le .vsix comme artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: db-explorer-lite-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Publier la release GitHub avec le .vsix
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
