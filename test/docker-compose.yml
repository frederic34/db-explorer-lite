# Bases jetables pour les tests : docker compose -f test/docker-compose.yml up -d --wait
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: test }
    ports: ['55432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 2s, timeout: 3s, retries: 30 }
    tmpfs: [/var/lib/postgresql/data]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: test }
    ports: ['53306:3306']
    healthcheck: { test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized'], interval: 2s, timeout: 3s, retries: 30 }
    tmpfs: [/var/lib/mysql]
